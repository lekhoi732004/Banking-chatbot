<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VietBank AI - Trợ lý ngân hàng thông minh, hỗ trợ tư vấn tài chính 24/7 với công nghệ AI tiên tiến.">
    <meta name="keywords" content="VietBank, ngân hàng, AI, chatbot, tư vấn tài chính, tỷ giá, lãi suất, vay vốn, thẻ tín dụng">
    <meta name="author" content="VietBank AI">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="VietBank AI - Trợ lý Ngân hàng Thông minh">
    <meta property="og:description" content="Hỗ trợ tư vấn tài chính 24/7 với công nghệ AI tiên tiến.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#07091a">
    <title>VietBank AI - Trợ lý Ngân hàng Thông minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="background-mesh"></div>

    <div class="app-layout" id="appLayout">
        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <span class="brand-icon">&#x1FAB6;</span>
                    <span class="brand-name">VietBank AI</span>
                </div>
                <button class="new-chat-btn" id="newChatBtn" title="Cuộc trò chuyện mới">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-search">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm hội thoại...">
            </div>

            <div class="sidebar-conversations" id="conversationList">
                <!-- Conversations will be injected by JS -->
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-footer-btn" id="clearAllBtn" title="Xóa tất cả">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                    <span>Xóa lịch sử</span>
                </button>
            </div>
        </aside>

        <!-- RESIZER HANDLE FOR DRAGGING -->
        <div class="sidebar-resizer" id="sidebarResizer" title="Kéo để co giãn thanh bên"></div>

        <!-- ========== SIDEBAR TOGGLE (mobile) ========== -->
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
        </button>

        <!-- ========== MAIN CHAT ========== -->
        <div class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <button class="header-menu-btn" id="headerMenuBtn" title="Menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <div class="header-info">
                        <h1 class="chat-title" id="chatTitle">Cuộc trò chuyện mới</h1>
                        <div class="status-bar">
                            <span class="status-dot" id="statusDot"></span>
                            <span class="status-text" id="statusText">Đang kết nối...</span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-decoration">
                        <span class="decoration-dot"></span>
                        <span class="decoration-dot"></span>
                        <span class="decoration-dot"></span>
                    </div>
                </div>
            </header>

            <main class="chat-messages" id="chatMessages">
                <!-- Messages will be injected here by JS -->
            </main>

            <div class="quick-replies" id="quickReplies">
                <div class="quick-replies-scroll">
                    <button class="quick-reply-btn" data-message="Tỷ giá ngoại tệ">
                        <svg class="qr-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3L21 7L17 11"/><path d="M3 7H21"/><path d="M7 21L3 17L7 13"/><path d="M21 17H3"/></svg> Tỷ giá ngoại tệ
                    </button>
                    <button class="quick-reply-btn" data-message="Lãi suất tiết kiệm">
                        <svg class="qr-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6L13.5 15.5L8.5 10.5L1 18"/><path d="M17 6H23V12"/></svg> Lãi suất tiết kiệm
                    </button>
                    <button class="quick-reply-btn" data-message="Mở tài khoản">
                        <svg class="qr-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Mở tài khoản
                    </button>
                    <button class="quick-reply-btn" data-message="Thẻ tín dụng">
                        <svg class="qr-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Thẻ tín dụng
                    </button>
                    <button class="quick-reply-btn" data-message="Vay vốn">
                        <svg class="qr-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Vay vốn
                    </button>
                </div>
            </div>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="Nhập tin nhắn của bạn..."
                        autocomplete="off"
                        maxlength="1000"
                    >
                    <button class="send-btn" id="sendBtn" aria-label="Gửi tin nhắn">
                        <svg class="send-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <p class="input-disclaimer">VietBank AI có thể đưa ra thông tin không chính xác. Vui lòng xác minh các thông tin quan trọng.</p>
            </footer>
        </div>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="js/app.js?v=20260605-2"></script>
</body>
</html>
